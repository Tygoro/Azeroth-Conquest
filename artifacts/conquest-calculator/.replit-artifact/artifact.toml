kind = "web"
previewPath = "/"
title = "Conquest of Azeroth Talent Calculator"
version = "1.0.0"
id = "artifacts/conquest-calculator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25621

[services.development]
run = "pnpm --filter @workspace/conquest-calculator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/conquest-calculator", "run", "build" ]
publicDir = "artifacts/conquest-calculator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25621"
BASE_PATH = "/"
